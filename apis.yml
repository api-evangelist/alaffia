aid: alaffia
name: Alaffia
description: >-
  Alaffia (Alaffia Health) is a New York City-based healthtech company building an AI platform that
  helps health plans reduce improper payments and administrative waste across claims operations. The
  platform pairs expert clinicians with transparent, traceable AI agents to automate routine clinical
  case reviews, normalize and extract data from medical records, and align clinical analysis with
  payer policy while keeping a human validation step. Alaffia targets three operational teams inside
  payers: payment integrity, utilization management, and appeals, offered as AI agents plus managed
  services. The company reports outcomes such as 20x throughput, 97%+ accuracy, and 5x ROI, and operates
  under HIPAA, SOC 2 Type II, and HITRUST compliance. Founded by TJ Ademiluyi (CEO) and Adun Akanni
  (COO), Alaffia raised a $55M Series B in February 2026 and is backed by FirstMark, Anthemis, and
  Transformation Capital. Alaffia currently exposes no public developer API or documentation surface;
  this profile captures its identity, security posture, and compliance program.
